format: goal-proposal/v1
task: TASK-007
add:
  - ref: tool-protocol
    title: Define and test the ChatGPT Web text tool protocol
    milestone: M-2
    kind: work
    after: [TASK-007, TASK-004, TASK-012, DEC-001, DEC-002]
    why: |
      SC-3 needs Codex to execute shell and file-edit tools. DEC-001 accepts
      text protocol B first; DEC-002 keeps the Node helper and provider kind
      chatgptweb_browser. Establish the contract before wiring the adapter.
    scope: |
      No cluster jobs in this task. Work offline; do not send browser prompts.
      Read docs/chatgptweb-provider.md, docs/chatgptweb-driver-protocol.md,
      docs/notes/chatgptweb-claude-code-feasibility.md and the existing adapter,
      discovery catalog, FakeDriver and Responses event emitters.

      First capture the installed Codex CLI's tool declarations and continuation
      inputs against a local fake Responses endpoint in an isolated scratch
      repository. Record the CLI version and keep sanitized fixtures in tests.
      Verify shell and edit shapes rather than assuming function tools alone:
      cover custom/freeform apply_patch and namespaced tools if Codex emits them.
      This probe must use only loopback, no real provider or browser. Keep the
      probe reproducible as an ignored test named capture_tool_surface in the
      new tests/chatgptweb_codex_smoke.rs, not a one-time capture script.

      Add a focused internal tool_protocol module beside translate.rs and
      document its exact versioned framing, examples and limits in the existing
      docs/chatgptweb-provider.md. Keep helper wire protocol v1 unchanged.
      Specify full ordered transcript serialization: instructions, declared
      tool schemas, messages, calls, call IDs and matching outputs. Treat quoted
      tool output as data. Preserve custom input as text and function arguments
      as JSON; validate against the declared tool kind/name and required shape.
      Reject unsupported tool types, malformed histories and unsupported
      tool_choice values before dispatch. Cover none, auto, required and named
      choices when emitted by the captured client; do not silently ignore them.

      Define and implement incremental text/tool framing over arbitrary driver
      TextDelta chunks. Stream ordinary text without waiting for the full answer.
      Hold a tool record until complete validation; use bounded buffers and
      explicit terminal handling. Reject unknown names, duplicate/conflicting
      call IDs, malformed/oversized/truncated records and ambiguous framing.
      Allocate or preserve unique IDs consistently across calls and results.
      Shunt never executes tools; Codex owns execution and approvals. Do not
      parse instructions or tool results as new assistant calls. Document the
      residual risk that model-generated calls still require client permissions.

      Keep current text-only behavior operational until the integration task.
      No MCP, tunnel, browser secret access, new public config, account rotation,
      Anthropic support or previous_response_id state store. If the captured
      client requires a material departure, use the worker Decision request
      protocol rather than silently narrowing SC-3 or switching to approach A.
    acceptance:
      - The contract and sanitized Codex fixtures cover the actual shell/edit tool surface and the next-turn result format; the offline capture command asserts these shapes.
      - Unit tests prove ordered transcript preservation, strict validation, stable call correlation, arbitrary chunk boundaries, Unicode, text streaming and bounded failure handling.
      - Existing text-only adapter and driver tests still pass; no live sends, new provider semantics or helper wire changes occur in this task.
    verify: |
      codex --version
      cargo test --test chatgptweb_codex_smoke capture_tool_surface -- --ignored --exact --nocapture --test-threads=1
      cargo test --lib adapters::chatgptweb::tool_protocol
      cargo test --test chatgptweb --test chatgptweb_adapter
      cargo fmt --all --check
      cargo clippy --all-targets --all-features -- -D warnings
      cargo test --all-features --workspace
      git diff --check

  - ref: tool-integration
    title: Integrate Codex tool turns and a self-checking fake demo
    milestone: M-2
    kind: work
    after: [tool-protocol]
    why: |
      SC-3 needs normal Responses tool events and complete follow-up turns.
      A deterministic Codex demo must prove the loop before using a live account.
    scope: |
      No cluster jobs in this task. Implement and verify on fixtures only.
      Integrate the merged contract from docs/chatgptweb-provider.md into
      src/adapters/chatgptweb/translate.rs and mod.rs. Reuse existing event
      helpers where they fit without fabricating browser token usage.
      Produce native function/custom call items for the captured tool surface,
      correct event order, monotonic sequence numbers, stable item/call IDs,
      argument/input deltas and matching final snapshots. Non-streaming JSON
      must match streamed completion. Tool results must appear in the next
      fresh chat's full transcript. Preserve ordinary text streaming, null
      usage, deadlines, account serialization, cancellation and no replay after
      failure or uncertain Send. Invalid output must end in failure, never
      success or an executable incomplete call. Validate requests before Send.

      Update src/discovery.rs to advertise exactly the supported shell/edit
      surface and remove text-only instructions that suppress tools. Test all
      three model catalog aliases. Keep serial tool execution sufficient for
      this milestone; do not advertise parallel tools without coverage.
      Extend tests/chatgptweb_adapter.rs using the existing Driver/FakeDriver
      seam for multi-turn calls/results, mixed text, custom input if needed,
      compressed input, streaming/non-streaming equivalence, malformed frames,
      wrong names/IDs, tool-choice enforcement and errors after partial text.
      Prove the existing codex pool and other provider catalogs are unchanged.

      Extend tests/chatgptweb_codex_smoke.rs with ignored tests named demo and
      live. Both run the real installed Codex CLI against an isolated local
      shunt endpoint and a temporary repository. Use per-process CLI config
      overrides, retaining model_provider=shunt; never edit the owner's Codex
      config or use its built-in OpenAI route. Disable unrelated inherited
      connectors/hooks in the isolated test configuration. Keep normal client
      tool permissions and a workspace-write sandbox, not an approval bypass.
      Require Codex to run a harmless shell command, edit a fixture file from
      BEFORE to AFTER, return the real tool outputs and give a final answer.
      Assert the file bytes and actual tool-execution events, not just prose.

      Demo uses a scripted Driver through the existing injection seam, with
      deterministic calls for the captured tool declarations and assertions on
      every incoming result. It needs no account, browser or external network.
      Add an adversarial demo case proving malformed output cannot edit a file.
      Include a bounded long-transcript/chunk-boundary fixture and assert the
      declared size limits; record elapsed time rather than a machine-specific
      timing threshold. This is the small scale check before the live run.

      Live must be explicit opt-in and fail, not skip, when its required inputs
      are absent. Define SHUNT_CHATGPTWEB_SMOKE_PROFILE and
      SHUNT_CHATGPTWEB_SMOKE_CDP_URL for this test only. Use the cemfi account
      with its already running owner Chrome. ProcessDriver does not pass
      --chrome: create a temporary .mjs launcher selected through the existing
      SHUNT_CHATGPTWEB_HELPER override, append --chrome/--cdp-url and import the
      production helper CLI. Do not add public config or replace the driver.
      Take tests/common/mod.rs's environment guard for the whole test.
      Test this launcher with local fixtures, including owner-browser survival.

      Build a non-sending health preflight, one-profile lock, a maximum of six
      Generate requests, a 15-minute total deadline and per-turn deadlines.
      Stop on errors or uncertain submission; never retry a submitted prompt.
      Every send must retain the production atomic Chat-only guard. Clean up
      test servers, helper children and scratch files while leaving owner Chrome
      and its original tabs open. Emit a sanitized summary with revision, CLI
      version, account/effort, calls/results, turn count, elapsed time and final
      file assertion. Run only capture/demo/fixture paths in this work task.

      Update docs/chatgptweb-provider.md with the runnable demo/live commands
      and limits. Update README.md and its ko/ja/zh-CN copies, and the provider
      site page plus ko/ja/zh-cn copies. Consider the driver protocol/helper
      README; change them only where behavior differs. Do not edit wiki.
      State that browser reliability remains subject to the separate live gate.
    acceptance:
      - Fake HTTP integration proves shell/edit calls, result replay and valid streamed/non-streamed Responses output while preserving text streaming and failure semantics.
      - The demo runs real Codex without a browser/account and asserts a shell command, actual file edit, returned tool results and final completion; malformed calls cannot cause edits.
      - Catalog aliases expose the tested tools; existing codex behavior remains covered and all affected maintained documentation is updated.
      - The live harness is implemented and fixture-tested with explicit inputs, Chat-only health/send guards, six-send/15-minute limits, no retries and owner-browser preservation.
    verify: |
      codex --version
      cargo test --test chatgptweb_codex_smoke capture_tool_surface -- --ignored --exact --nocapture --test-threads=1
      cargo test --test chatgptweb_codex_smoke demo -- --ignored --exact --nocapture --test-threads=1
      cargo test --test chatgptweb --test chatgptweb_adapter --test codex_multi_account --test inbound_codex_endpoint --test inbound_codex_routes
      npm ci --prefix helpers/chatgptweb-browser
      npm exec --prefix helpers/chatgptweb-browser -- playwright install chromium
      npm test --prefix helpers/chatgptweb-browser
      cargo fmt --all --check
      cargo clippy --all-targets --all-features -- -D warnings
      cargo test --all-features --workspace
      npm ci --prefix site
      npm run build --prefix site
      git diff --check

  - ref: tool-live-smoke
    title: Live smoke a Codex shell and file-edit task in Chat mode
    milestone: M-2
    kind: run
    after: [tool-integration, TASK-005, TASK-012]
    why: |
      Close SC-3 with a real Codex tool loop through the merged adapter.
      TASK-012 observed a guarded live answer, but did not prove the whole
      gateway, clipboard and tool-result path. TASK-006 was waived by the
      owner; quota equality is not a gate for this run.
    scope: |
      Run merged code only. Read docs/chatgptweb-provider.md and the preceding
      outcomes, then run the same demo before opting into live. No code fixes
      or account provisioning in this task. Use the harness commands below.

      Outside prerequisites: installed Codex, Node/helper dependencies and
      browser; cemfi already signed in manually to owner Chrome, using
      ~/.local/share/shunt/chatgptweb-browser/chrome/cemfi and loopback CDP
      http://127.0.0.1:9333; no competing owner/worker use of that profile.
      Health must establish Chat=true and Work=false before any send.
      Login, challenge, unknown mode or inaccessible profile blocks the run.
      Do not automate sign-in/challenges, copy cookies or switch to Work.
      The earlier TASK-012 one-send authorization is not reusable evidence or
      permission for extra probes; this task is the separate bounded smoke.

      Budget: one Codex process, one gateway, one attached account, one scratch
      repository, one serial run (shard 1/1; no merge step). At most six fresh
      chat sends and 15 minutes total, with the merged per-turn deadline.
      Stop on the first failure; no automatic rerun after Send. Preserve the
      sanitized summary and report the blocker. Resume after a crash only
      after reviewing whether a prompt was sent; uncertain sends are not
      replayed. A required implementation change goes in a separate follow-up.

      Require an actual shell tool execution and fixture file edit through
      Codex, tool results in subsequent browser transcripts, and a final answer.
      Paste command exits and sanitized harness assertions into this task's
      outcome and PR, with source revision, CLI version, observed effort,
      send count, elapsed time and owner-browser survival. Do not commit raw
      transcripts, profiles or temporary evidence. The existing codex pool and
      the owner's config remain unchanged. No second account or Claude Code.
      If text protocol reliability prevents completion, use the worker Decision
      request protocol with concrete evidence; do not adopt MCP/tunnel here.
    acceptance:
      - The merged demo passes immediately before the live attempt, and live health confirms the signed-in cemfi profile in Chat mode.
      - Real Codex runs a shell command, edits the fixture to the exact expected bytes, returns tool results and finishes through chatgptweb_browser; the live command exits 0.
      - Sanitized outcome evidence records revision, client version, effort, call/result IDs, send count, elapsed time and final file assertion within the six-send/15-minute budget; owner Chrome remains usable.
    verify: |
      git rev-parse HEAD
      codex --version
      cargo test --test chatgptweb_codex_smoke demo -- --ignored --exact --nocapture --test-threads=1
      SHUNT_CHATGPTWEB_SMOKE_PROFILE="$HOME/.local/share/shunt/chatgptweb-browser/chrome/cemfi" SHUNT_CHATGPTWEB_SMOKE_CDP_URL="http://127.0.0.1:9333" cargo test --test chatgptweb_codex_smoke live -- --ignored --exact --nocapture --test-threads=1
      git diff --check
