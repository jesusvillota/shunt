format: goal/v2
id: account-pinning
title: Per-goal account pinning
objective: Let each goal draw only from a configured subset of a platform's accounts (overlapping goals share accounts; goals without an entry use all), carried by a per-goal shunt client token that the goal CLI hands to each session, with the keeper waking on the goal's own subset reset.
base: main
success:
  SC-1: <observable result and how it is verified>
milestones:
  - {id: M-1, title: <first observable outcome>, success: [SC-1], exit: <verifiable evidence>}
policy:
  decide: human         # human | experts (a committee answers worker decision requests)
  orchestrator: {platform: claude, model: sonnet, effort: medium}
  max_parallel: 7
  default_route: null   # {platform: codex, model: MODEL, effort: LEVEL}
  agent: claude         # claude | codex | opencode | agy
  turn_budget: 40
  plan_commits: push    # push | commit | off
  worktree_setup: null  # shell run in each new task worktree, e.g. "uv sync"
