format: goal/v2
id: agy-pool
title: Fix the Antigravity pool and quota tracking
objective: Make the shunt antigravity pool serve traffic across all configured accounts and track each account's quota.
base: main
success:
  SC-1: Each configured antigravity account shows live Gemini and Claude+GPT 5h/weekly quota in `goal pool` and the admin/TUI, verified against a live gateway.
  SC-2: Requests to the antigravity provider rotate across all configured accounts and fail over when one is exhausted, verified by an integration test and a live smoke.
milestones:
  - {id: M-1, title: Working agy pool with quota, success: [SC-1, SC-2], exit: "All M-1 PRs merged and live smoke shows per-account quota and multi-account rotation"}
policy:
  decide: human
  orchestrator_mode: interactive
  routing: fixed
  orchestrator: {platform: claude, model: sonnet, effort: medium}
  default_route: {platform: codex, model: gpt-6.1-sol, effort: high}
