format: goal/v2
id: agy-pool
title: Fix the Antigravity pool and quota tracking
objective: Make the shunt antigravity pool serve traffic across all configured accounts and track each account's quota.
base: main
success:
  SC-1: <observable result and how it is verified>
milestones:
  - {id: M-1, title: <first observable outcome>, success: [SC-1], exit: <verifiable evidence>}
policy:
  decide: human         # human | experts (a committee answers worker decision requests)
  orchestrate: you      # you | agent: an orchestrator agent approves, dispatches and merges 
  orchestrator_mode: interactive  # interactive | headless: visible agent vs background loop
  routing: fixed        # with an orchestrator: fixed respects each task's route; dynamic lets it choose
  orchestrator: null    # {platform: codex, model: MODEL, effort: LEVEL}
  max_parallel: 7
  default_route: null   # {platform: codex, model: MODEL, effort: LEVEL}
  agent: claude         # claude | codex | opencode | agy
  turn_budget: 40
  plan_commits: push    # push | commit | off
  worktree_setup: null  # shell run in each new task worktree, e.g. "uv sync"
